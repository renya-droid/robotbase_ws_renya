# Gazebo用キーボード操作。シミュレーションの低速停滞域を一操作で越える。
robotbase_keyop_v2:
  ros__parameters:
    linear_step: 0.2
    angular_step: 0.1
    max_linear_velocity: 0.9
    max_angular_velocity: 0.9
    manual_override_grace_period: 1.0
    stop_release_duration: 0.5
    reset_topic: /robotbase/reset
    pause_waypoint_topic: /waypoint_record/pause
