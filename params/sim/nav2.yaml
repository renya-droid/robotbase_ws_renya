# ココちゃんGazeboシミュレーション用Nav2設定。
# センサー入力はVLP-16の複数リングから生成した /scan3 のみ。

amcl:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_footprint
    global_frame_id: map
    odom_frame_id: odom
    scan_topic: /scan3
    robot_model_type: nav2_amcl::DifferentialMotionModel
    laser_model_type: likelihood_field
    min_particles: 500
    max_particles: 2000
    max_beams: 120
    laser_min_range: 0.20
    laser_max_range: 25.0
    update_min_d: 0.10
    update_min_a: 0.10
    transform_tolerance: 1.0
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.5
      use_astar: true
      allow_unknown: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_footprint
      update_frequency: 2.0
      publish_frequency: 1.0
      resolution: 0.05
      track_unknown_space: true
      # 全長0.90 m（前0.425/後0.475）、全幅0.66 m（左右各0.33）。
      footprint: "[[0.425, 0.33], [0.425, -0.33], [-0.475, -0.33], [-0.475, 0.33]]"
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /scan3
          data_type: LaserScan
          max_obstacle_height: 2.0
          marking: true
          clearing: true
          obstacle_max_range: 15.0
          raytrace_max_range: 20.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.70
        cost_scaling_factor: 3.0
      always_send_full_costmap: true

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 10.0
    failure_tolerance: 0.5
    use_realtime_priority: false
    enable_stamped_cmd_vel: false
    odom_topic: /odom
    # 低速指令で停止状態に留まらないよう、Gazeboの実効低速域を停止扱いにする。
    min_x_velocity_threshold: 0.10
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.20
      movement_time_allowance: 30.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
    FollowPath:
      plugin: nav2_mppi_controller::MPPIController
      # 10 Hzで2.8秒先まで予測。最高速時も6 m local costmap内へ収める。
      time_steps: 28
      model_dt: 0.10
      batch_size: 2000
      # MPPIに固定の巡航速度はないため、運用上の前進基準を上限0.90 m/sで定義する。
      vx_max: 0.90
      vx_min: -0.30
      vy_max: 0.0
      vy_min: 0.0
      wz_max: 0.90
      wz_min: -0.90
      # 0.90 m/s付近までの候補軌道を十分に生成する。
      vx_std: 0.30
      vy_std: 0.0
      wz_std: 0.30
      ax_max: 0.90
      ax_min: -0.90
      ay_max: 0.0
      ay_min: 0.0
      az_max: 1.50
      az_min: -1.50
      iteration_count: 1
      prune_distance: 3.0
      transform_tolerance: 0.10
      temperature: 0.30
      # 操作量を抑えるコスト。Nav2標準値へ戻し、加速を過度に抑えない。
      gamma: 0.050
      motion_model: DiffDrive
      visualize: false
      regenerate_noises: false
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      critics: [ConstraintCritic, CostCritic, GoalCritic, GoalAngleCritic, PathAlignCritic, PathFollowCritic, PathAngleCritic, PreferForwardCritic, VelocityDeadbandCritic]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 6.0
      CostCritic:
        enabled: true
        cost_power: 1
        # 広いinflation領域で停止・周回しないよう標準域へ戻す。
        # 実衝突はfootprint判定とcollision_costで引き続き禁止する。
        cost_weight: 4.0
        near_collision_cost: 200
        critical_cost: 300.0
        # 長方形の車体前端・角まで衝突評価する。
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 1
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0
        threshold_to_consider: 1.0
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0
        max_path_occupancy_ratio: 0.10
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 25
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        # 障害物回避を維持しつつ、経路上を前へ進む軌道を強く評価する。
        cost_weight: 8.0
        # 0.05 m間隔の経路で約0.55 m先。1.68 m予測距離のおよそ1/3。
        offset_from_furthest: 11
        threshold_to_consider: 1.0
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 0.5
        mode: 0
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        # 後退は禁止せず、通常は向き直って前進する軌道を強く優先する。
        cost_weight: 40.0
        threshold_to_consider: 0.5
      VelocityDeadbandCritic:
        enabled: true
        cost_power: 1
        # 0.1 m/s付近に留まらず、動き出せる軌道を選ばせる。
        cost_weight: 35.0
        deadband_velocities: [0.10, 0.0, 0.0]

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_footprint
      update_frequency: 5.0
      publish_frequency: 2.0
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      # global/localで同じ実車外形を使用する。
      footprint: "[[0.425, 0.33], [0.425, -0.33], [-0.475, -0.33], [-0.475, 0.33]]"
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /scan3
          data_type: LaserScan
          max_obstacle_height: 2.0
          marking: true
          clearing: true
          obstacle_max_range: 10.0
          raytrace_max_range: 15.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.70
        cost_scaling_factor: 5.0
      always_send_full_costmap: true

smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    behavior_plugins: [spin, backup, drive_on_heading, wait]
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
    wait:
      plugin: nav2_behaviors::Wait

bt_navigator:
  ros__parameters:
    plugin_lib_names: [robotbase_remove_traversed_goals_bt_node]
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    default_nav_to_pose_bt_xml: "$(find-pkg-share robotbase_bringup)/behavior_trees/navigate_to_pose_w_replanning_goal_patience_and_recovery_no_spin.xml"
    default_nav_through_poses_bt_xml: "$(find-pkg-share robotbase_bringup)/behavior_trees/navigate_through_poses_w_replanning_goal_patience_and_recovery_no_spin.xml"
    navigators: [navigate_to_pose, navigate_through_poses]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [0.90, 0.0, 0.90]
    min_velocity: [-0.30, 0.0, -0.90]
    max_accel: [0.90, 0.0, 1.50]
    max_decel: [-0.90, 0.0, -1.50]
    odom_topic: /odom
    odom_duration: 0.3
    deadband_velocity: [0.10, 0.0, 0.0]
    velocity_timeout: 1.0

# Nav2標準の/follow_waypoints action server。独自YAMLと同時にgoalを送らない。
waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    global_frame_id: map
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 200
