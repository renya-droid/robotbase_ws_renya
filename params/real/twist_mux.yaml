# ココちゃん実機用twist_mux設定。
twist_mux:
  ros__parameters:
    use_stamped: false
    topics:
      # Dedicated elevator zero-velocity input, paired with the persistent lock.
      elevator_stop:
        topic: /cmd_vel_stop
        timeout: 0.5
        priority: 254
      teleop:
        topic: cmd_vel_teleop
        timeout: 0.5
        priority: 100
      direct:
        topic: cmd_vel_direct
        timeout: 0.5
        priority: 90
      navigation:
        topic: cmd_vel_smoothed
        timeout: 0.5
        priority: 10
      idle:
        topic: cmd_vel_idle
        timeout: 0.5
        priority: 1
    locks:
      elevator_stop:
        topic: /elevator_safety_stop
        timeout: 0.0
        priority: 254
      stop:
        topic: /stop
        timeout: 0.0
        priority: 255
