# ココちゃん実機用WitMotion IMU設定。
witmotion:
  ros__parameters:
    use_sim_time: false
    port: wt905
    baud_rate: 115200
    polling_interval: 5
    timeout_ms: 300
    restart_service_name: /restart_imu
    imu_publisher:
      topic_name: /imu
      frame_id: imu_link
      use_native_orientation: false
      measurements:
        acceleration:
          enabled: true
          covariance: [0.0364, 0.0, 0.0, 0.0, 0.0048, 0.0, 0.0, 0.0, 0.0796]
        angular_velocity:
          enabled: true
          covariance: [0.0663, 0.0, 0.0, 0.0, 0.1453, 0.0, 0.0, 0.0, 0.0378]
        orientation:
          enabled: true
          covariance: [0.0479, 0.0, 0.0, 0.0, 0.0207, 0.0, 0.0, 0.0, 0.0041]
    temperature_publisher:
      enabled: false
    magnetometer_publisher:
      enabled: false
    barometer_publisher:
      enabled: false
    altimeter_publisher:
      enabled: false
    orientation_publisher:
      enabled: false
    gps_publisher:
      enabled: false
    rtc_publisher:
      enabled: false
