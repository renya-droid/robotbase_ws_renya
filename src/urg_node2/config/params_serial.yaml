urg_node2:
  ros__parameters:
    serial_port: '/dev/hokuyo'
    serial_baud: 115200
    frame_id : 'laser'
    calibrate_time : false
    synchronize_time : false
    publish_intensity : false
    publish_multiecho : false
    error_limit : 4
    error_reset_period : 5.0
    diagnostics_tolerance : 0.05
    diagnostics_window_time : 5.0
    time_offset : 0.0
    # Sensor front is 0 rad: scan the front half from right -90 deg to left +90 deg.
    angle_min : -1.57079632679
    angle_max : 1.57079632679
    skip : 0
    cluster : 1
