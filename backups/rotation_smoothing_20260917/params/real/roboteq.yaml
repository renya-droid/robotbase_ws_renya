# ココちゃん実機用Roboteq設定。車輪径・トレッド幅・encoder符号は実測値に合わせる。
roboteq_ros2_driver:
  ros__parameters:
    pub_odom_tf: true
    odom_frame: odom
    base_frame: base_footprint
    cmdvel_topic: cmd_vel
    odom_topic: odom
    port: /dev/roboteq
    baud: 230400
    open_loop: false
    wheel_circumference: 0.6283
    track_width: 0.435
    max_amps: 12.0
    max_rpm: 58
    gear_ratio: 1.0
    pulse: 950
    max_speed: 1.5
    odom_stream_interval_ms: 10
    odom_publish_hz: 50.0
    speed_scale: 0.70
    kp_soft: 0.3
    min_speed_threshold: 0.18
    encoder_sign_r: -1.0
    encoder_sign_l: 1.0
